# AnantaNetra / IBVAP - MQTT broker (LAB / DEMO configuration)
#
# This config is for a field demonstration and a trusted network only.
#
# SECURITY: anonymous access is enabled so the demo comes up with a single
# `docker compose up`. A real deployment MUST do all three of the following
# before it touches a border network:
#
#   1. Enable authentication:
#        password_file /mosquitto/config/passwd
#        allow_anonymous false
#      (create it with: mosquitto_passwd -c passwd ibvap)
#   2. Enable TLS - alert payloads contain evidence imagery and geolocation:
#        listener 8883
#        cafile   /mosquitto/config/ca.crt
#        certfile /mosquitto/config/server.crt
#        keyfile  /mosquitto/config/server.key
#   3. Restrict topics per outpost, so one compromised node cannot inject or
#      read another sector's traffic (see the `topic` ACL directives below).

listener 1883
allow_anonymous true

# QoS 0 is used by the edge publisher. Durability is provided at the EDGE, not
# the broker: packets are buffered and retransmitted by modules/telemetry.py, so
# a broker restart does not lose an alert that has already left an outpost.
persistence false

# Bounded queue: on a saturated satellite link the broker must shed, not grow.
max_queued_messages 1000
max_inflight_messages 20
message_size_limit 32768

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# --- Per-outpost topic ACL (enable with the password file above) -------------
# topic readwrite ssb/anantanetra/alerts
# topic write     ssb/anantanetra/telemetry
# pattern readwrite ssb/%u/#
